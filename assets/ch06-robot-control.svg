<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">从目标到安全动作的分层闭环</title><desc id="desc">每段动作后，用新观察确认。人类目标 杯子放入托盘 明确范围与成功条件；任务与技能 先抓取，再放置 每步带完成检查；动作策略 画面与技能变成动作 短段规划及时更新；执行与安全 限速、边界与急停 真实反馈决定继续</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="90" y="68" width="11" height="58" rx="5" fill="#2563EB"/>
<text x="125" y="113" font-size="52" fill="#15243D" font-weight="650">从目标到安全动作的分层闭环</text>
<text x="125" y="175" font-size="32" fill="#52627C" font-weight="400">每段动作后，用新观察确认</text>
<rect x="90" y="250" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="293" r="20" fill="#2563EB"/>
<text x="126" y="301" font-size="23" fill="#FFFFFF" font-weight="600">1</text>
<text x="118" y="356" font-size="36" fill="#15243D" font-weight="650">人类目标</text>
<text x="118" y="412" font-size="30" fill="#52627C" font-weight="400">杯子放入托盘</text>
<text x="118" y="457" font-size="30" fill="#52627C" font-weight="400">明确范围与成功条件</text>
<path d="M880 387.5H916" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="930" y="250" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="972" cy="293" r="20" fill="#2563EB"/>
<text x="966" y="301" font-size="23" fill="#FFFFFF" font-weight="600">2</text>
<text x="958" y="356" font-size="36" fill="#15243D" font-weight="650">任务与技能</text>
<text x="958" y="412" font-size="30" fill="#52627C" font-weight="400">先抓取，再放置</text>
<text x="958" y="457" font-size="30" fill="#52627C" font-weight="400">每步带完成检查</text>
<path d="M1320 535V591" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="930" y="605" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="972" cy="648" r="20" fill="#2563EB"/>
<text x="966" y="656" font-size="23" fill="#FFFFFF" font-weight="600">3</text>
<text x="958" y="711" font-size="36" fill="#15243D" font-weight="650">动作策略</text>
<text x="958" y="767" font-size="30" fill="#52627C" font-weight="400">画面与技能变成动作</text>
<text x="958" y="812" font-size="30" fill="#52627C" font-weight="400">短段规划及时更新</text>
<path d="M920 742.5H884" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="90" y="605" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="648" r="20" fill="#2563EB"/>
<text x="126" y="656" font-size="23" fill="#FFFFFF" font-weight="600">4</text>
<text x="118" y="711" font-size="36" fill="#15243D" font-weight="650">执行与安全</text>
<text x="118" y="767" font-size="30" fill="#52627C" font-weight="400">限速、边界与急停</text>
<text x="118" y="812" font-size="30" fill="#52627C" font-weight="400">真实反馈决定继续</text>
<path d="M82 742.5H55V387.5H78" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<text x="125" y="902" font-size="26" fill="#2563EB" font-weight="400">虚线回路：真实观察返回，用于重新检查目标与动作</text>
<line x1="90" y1="920" x2="1710" y2="920" stroke="#D7E0EF" stroke-width="2"/>
<text x="90" y="975" font-size="31" fill="#52627C" font-weight="400">各层有不同反馈频率；模拟成功不能冒充真机成功</text>
<text x="90" y="1029" font-size="25" fill="#52627C" font-weight="400">苏打白 Dev · AI Agent 通俗学习版</text>
</g></svg>