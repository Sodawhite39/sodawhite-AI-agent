<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">经验怎样成为新能力</title><desc id="desc">先保留证据，候选必须经过验证。运行与记录 保存工具和状态证据 保留原始轨迹；评价与对照 核对成败和合规 比较多条轨迹；提出局部修改 写清适用条件 保留来源与旧版本；独立检查 边界任务要改善 旧任务与安全不退化；发布或回滚 小范围使用新版 发现退化立即退回</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="90" y="68" width="11" height="58" rx="5" fill="#2563EB"/>
<text x="125" y="113" font-size="52" fill="#15243D" font-weight="650">经验怎样成为新能力</text>
<text x="125" y="175" font-size="32" fill="#52627C" font-weight="400">先保留证据，候选必须经过验证</text>
<rect x="90" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="293" r="20" fill="#2563EB"/>
<text x="126" y="301" font-size="23" fill="#FFFFFF" font-weight="600">1</text>
<text x="118" y="356" font-size="36" fill="#15243D" font-weight="650">运行与记录</text>
<text x="118" y="412" font-size="30" fill="#52627C" font-weight="400">保存工具和状态证据</text>
<text x="118" y="457" font-size="30" fill="#52627C" font-weight="400">保留原始轨迹</text>
<path d="M600 387.5H636" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="650" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="692" cy="293" r="20" fill="#2563EB"/>
<text x="686" y="301" font-size="23" fill="#FFFFFF" font-weight="600">2</text>
<text x="678" y="356" font-size="36" fill="#15243D" font-weight="650">评价与对照</text>
<text x="678" y="412" font-size="30" fill="#52627C" font-weight="400">核对成败和合规</text>
<text x="678" y="457" font-size="30" fill="#52627C" font-weight="400">比较多条轨迹</text>
<path d="M1160 387.5H1196" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1210" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="1252" cy="293" r="20" fill="#2563EB"/>
<text x="1246" y="301" font-size="23" fill="#FFFFFF" font-weight="600">3</text>
<text x="1238" y="356" font-size="36" fill="#15243D" font-weight="650">提出局部修改</text>
<text x="1238" y="412" font-size="30" fill="#52627C" font-weight="400">写清适用条件</text>
<text x="1238" y="457" font-size="30" fill="#52627C" font-weight="400">保留来源与旧版本</text>
<path d="M1460 535V591" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1210" y="605" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="1252" cy="648" r="20" fill="#2563EB"/>
<text x="1246" y="656" font-size="23" fill="#FFFFFF" font-weight="600">4</text>
<text x="1238" y="711" font-size="36" fill="#15243D" font-weight="650">独立检查</text>
<text x="1238" y="767" font-size="30" fill="#52627C" font-weight="400">边界任务要改善</text>
<text x="1238" y="812" font-size="30" fill="#52627C" font-weight="400">旧任务与安全不退化</text>
<path d="M1200 742.5H1164" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="650" y="605" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="692" cy="648" r="20" fill="#2563EB"/>
<text x="686" y="656" font-size="23" fill="#FFFFFF" font-weight="600">5</text>
<text x="678" y="711" font-size="36" fill="#15243D" font-weight="650">发布或回滚</text>
<text x="678" y="767" font-size="30" fill="#52627C" font-weight="400">小范围使用新版</text>
<text x="678" y="812" font-size="30" fill="#52627C" font-weight="400">发现退化立即退回</text>
<path d="M642 742.5H55V387.5H78" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<line x1="90" y1="920" x2="1710" y2="920" stroke="#D7E0EF" stroke-width="2"/>
<text x="90" y="975" font-size="31" fill="#52627C" font-weight="400">保存记录和生成反思，都不自动等于学习完成</text>
<text x="90" y="1029" font-size="25" fill="#52627C" font-weight="400">苏打白 Dev · AI Agent 通俗学习版</text>
</g></svg>