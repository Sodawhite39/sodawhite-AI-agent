<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">训练的四个阶段各教什么</title><desc id="desc">依据任务缺口选择，不必每次全部重做。预训练 大量通用资料 预测下一词元；中期训练 补领域与基础能力 同时复习旧能力；监督微调 学习好示范 稳定格式与流程；强化学习 尝试并接受反馈 提高好策略概率</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="90" y="68" width="11" height="58" rx="5" fill="#2563EB"/>
<text x="125" y="113" font-size="52" fill="#15243D" font-weight="650">训练的四个阶段各教什么</text>
<text x="125" y="175" font-size="32" fill="#52627C" font-weight="400">依据任务缺口选择，不必每次全部重做</text>
<rect x="90" y="250" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="293" r="20" fill="#2563EB"/>
<text x="126" y="301" font-size="23" fill="#FFFFFF" font-weight="600">1</text>
<text x="118" y="356" font-size="36" fill="#15243D" font-weight="650">预训练</text>
<text x="118" y="412" font-size="30" fill="#52627C" font-weight="400">大量通用资料</text>
<text x="118" y="457" font-size="30" fill="#52627C" font-weight="400">预测下一词元</text>
<rect x="930" y="250" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="972" cy="293" r="20" fill="#2563EB"/>
<text x="966" y="301" font-size="23" fill="#FFFFFF" font-weight="600">2</text>
<text x="958" y="356" font-size="36" fill="#15243D" font-weight="650">中期训练</text>
<text x="958" y="412" font-size="30" fill="#52627C" font-weight="400">补领域与基础能力</text>
<text x="958" y="457" font-size="30" fill="#52627C" font-weight="400">同时复习旧能力</text>
<rect x="90" y="605" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="648" r="20" fill="#2563EB"/>
<text x="126" y="656" font-size="23" fill="#FFFFFF" font-weight="600">3</text>
<text x="118" y="711" font-size="36" fill="#15243D" font-weight="650">监督微调</text>
<text x="118" y="767" font-size="30" fill="#52627C" font-weight="400">学习好示范</text>
<text x="118" y="812" font-size="30" fill="#52627C" font-weight="400">稳定格式与流程</text>
<rect x="930" y="605" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="972" cy="648" r="20" fill="#2563EB"/>
<text x="966" y="656" font-size="23" fill="#FFFFFF" font-weight="600">4</text>
<text x="958" y="711" font-size="36" fill="#15243D" font-weight="650">强化学习</text>
<text x="958" y="767" font-size="30" fill="#52627C" font-weight="400">尝试并接受反馈</text>
<text x="958" y="812" font-size="30" fill="#52627C" font-weight="400">提高好策略概率</text>
<line x1="90" y1="920" x2="1710" y2="920" stroke="#D7E0EF" stroke-width="2"/>
<text x="90" y="975" font-size="31" fill="#52627C" font-weight="400">阶段名称是能力地图，不是所有项目的固定流水线</text>
<text x="90" y="1029" font-size="25" fill="#52627C" font-weight="400">苏打白 Dev · AI Agent 通俗学习版</text>
</g></svg>