<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">前缀保持一致，新信息接在后面</title><desc id="desc">改动点之前可以复用，改动点之后需重新处理。固定内容 规则与核心工具 尽量不随每轮变化；既有历史 已经读过的序列 保留顺序和原位置；新观察与状态 时间、进度、新结果 按协议追加；需要改写时 承认缓存重建代价 先保证规则正确</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="90" y="68" width="11" height="58" rx="5" fill="#2563EB"/>
<text x="125" y="113" font-size="52" fill="#15243D" font-weight="650">前缀保持一致，新信息接在后面</text>
<text x="125" y="175" font-size="32" fill="#52627C" font-weight="400">改动点之前可以复用，改动点之后需重新处理</text>
<rect x="90" y="250" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="293" r="20" fill="#2563EB"/>
<text x="126" y="301" font-size="23" fill="#FFFFFF" font-weight="600">1</text>
<text x="118" y="356" font-size="36" fill="#15243D" font-weight="650">固定内容</text>
<text x="118" y="412" font-size="30" fill="#52627C" font-weight="400">规则与核心工具</text>
<text x="118" y="457" font-size="30" fill="#52627C" font-weight="400">尽量不随每轮变化</text>
<rect x="930" y="250" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="972" cy="293" r="20" fill="#2563EB"/>
<text x="966" y="301" font-size="23" fill="#FFFFFF" font-weight="600">2</text>
<text x="958" y="356" font-size="36" fill="#15243D" font-weight="650">既有历史</text>
<text x="958" y="412" font-size="30" fill="#52627C" font-weight="400">已经读过的序列</text>
<text x="958" y="457" font-size="30" fill="#52627C" font-weight="400">保留顺序和原位置</text>
<rect x="90" y="605" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="648" r="20" fill="#2563EB"/>
<text x="126" y="656" font-size="23" fill="#FFFFFF" font-weight="600">3</text>
<text x="118" y="711" font-size="36" fill="#15243D" font-weight="650">新观察与状态</text>
<text x="118" y="767" font-size="30" fill="#52627C" font-weight="400">时间、进度、新结果</text>
<text x="118" y="812" font-size="30" fill="#52627C" font-weight="400">按协议追加</text>
<rect x="930" y="605" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="972" cy="648" r="20" fill="#2563EB"/>
<text x="966" y="656" font-size="23" fill="#FFFFFF" font-weight="600">4</text>
<text x="958" y="711" font-size="36" fill="#15243D" font-weight="650">需要改写时</text>
<text x="958" y="767" font-size="30" fill="#52627C" font-weight="400">承认缓存重建代价</text>
<text x="958" y="812" font-size="30" fill="#52627C" font-weight="400">先保证规则正确</text>
<line x1="90" y1="920" x2="1710" y2="920" stroke="#D7E0EF" stroke-width="2"/>
<text x="90" y="975" font-size="31" fill="#52627C" font-weight="400">缓存不等于长期记忆；跨请求缓存还取决于服务商支持与有效期。</text>
<text x="90" y="1029" font-size="25" fill="#52627C" font-weight="400">苏打白 Dev · AI Agent 通俗学习版</text>
</g></svg>