<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">持续进化的三道安全边界</title><desc id="desc">更新者不能批准自己的修改。不可信证据 网页、邮件、工具输出 只作为待核对材料；候选修改区 最小提案与来源 沙盒和回归检查；独立批准 保护验证器和门槛 高风险等待人审查；正式能力 版本化发布与审计 稳定备份可以回滚</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="90" y="68" width="11" height="58" rx="5" fill="#2563EB"/>
<text x="125" y="113" font-size="52" fill="#15243D" font-weight="650">持续进化的三道安全边界</text>
<text x="125" y="175" font-size="32" fill="#52627C" font-weight="400">更新者不能批准自己的修改</text>
<rect x="90" y="250" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="293" r="20" fill="#2563EB"/>
<text x="126" y="301" font-size="23" fill="#FFFFFF" font-weight="600">1</text>
<text x="118" y="356" font-size="36" fill="#15243D" font-weight="650">不可信证据</text>
<text x="118" y="412" font-size="30" fill="#52627C" font-weight="400">网页、邮件、工具输出</text>
<text x="118" y="457" font-size="30" fill="#52627C" font-weight="400">只作为待核对材料</text>
<path d="M880 387.5H916" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="930" y="250" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="972" cy="293" r="20" fill="#2563EB"/>
<text x="966" y="301" font-size="23" fill="#FFFFFF" font-weight="600">2</text>
<text x="958" y="356" font-size="36" fill="#15243D" font-weight="650">候选修改区</text>
<text x="958" y="412" font-size="30" fill="#52627C" font-weight="400">最小提案与来源</text>
<text x="958" y="457" font-size="30" fill="#52627C" font-weight="400">沙盒和回归检查</text>
<path d="M1320 535V591" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="930" y="605" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="972" cy="648" r="20" fill="#2563EB"/>
<text x="966" y="656" font-size="23" fill="#FFFFFF" font-weight="600">3</text>
<text x="958" y="711" font-size="36" fill="#15243D" font-weight="650">独立批准</text>
<text x="958" y="767" font-size="30" fill="#52627C" font-weight="400">保护验证器和门槛</text>
<text x="958" y="812" font-size="30" fill="#52627C" font-weight="400">高风险等待人审查</text>
<path d="M920 742.5H884" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="90" y="605" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="648" r="20" fill="#2563EB"/>
<text x="126" y="656" font-size="23" fill="#FFFFFF" font-weight="600">4</text>
<text x="118" y="711" font-size="36" fill="#15243D" font-weight="650">正式能力</text>
<text x="118" y="767" font-size="30" fill="#52627C" font-weight="400">版本化发布与审计</text>
<text x="118" y="812" font-size="30" fill="#52627C" font-weight="400">稳定备份可以回滚</text>
<line x1="90" y1="920" x2="1710" y2="920" stroke="#D7E0EF" stroke-width="2"/>
<text x="90" y="975" font-size="31" fill="#52627C" font-weight="400">模型摘要不会把恶意输入自动变成可信指令</text>
<text x="90" y="1029" font-size="25" fill="#52627C" font-weight="400">苏打白 Dev · AI Agent 通俗学习版</text>
</g></svg>