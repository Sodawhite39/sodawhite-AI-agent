<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">观察与动作怎样扩展</title><desc id="desc">形式在变，信息到达的时机也在变。事件驱动 新消息主动到达 动作可在后台继续；语音 声音、语调与停顿 听说交接与打断；电脑操作 变化中的屏幕 点击后重新核对；机器人 连续传感反馈 受限动作与急停</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="90" y="68" width="11" height="58" rx="5" fill="#2563EB"/>
<text x="125" y="113" font-size="52" fill="#15243D" font-weight="650">观察与动作怎样扩展</text>
<text x="125" y="175" font-size="32" fill="#52627C" font-weight="400">形式在变，信息到达的时机也在变</text>
<rect x="90" y="250" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="293" r="20" fill="#2563EB"/>
<text x="126" y="301" font-size="23" fill="#FFFFFF" font-weight="600">1</text>
<text x="118" y="356" font-size="36" fill="#15243D" font-weight="650">事件驱动</text>
<text x="118" y="412" font-size="30" fill="#52627C" font-weight="400">新消息主动到达</text>
<text x="118" y="457" font-size="30" fill="#52627C" font-weight="400">动作可在后台继续</text>
<rect x="930" y="250" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="972" cy="293" r="20" fill="#2563EB"/>
<text x="966" y="301" font-size="23" fill="#FFFFFF" font-weight="600">2</text>
<text x="958" y="356" font-size="36" fill="#15243D" font-weight="650">语音</text>
<text x="958" y="412" font-size="30" fill="#52627C" font-weight="400">声音、语调与停顿</text>
<text x="958" y="457" font-size="30" fill="#52627C" font-weight="400">听说交接与打断</text>
<rect x="90" y="605" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="648" r="20" fill="#2563EB"/>
<text x="126" y="656" font-size="23" fill="#FFFFFF" font-weight="600">3</text>
<text x="118" y="711" font-size="36" fill="#15243D" font-weight="650">电脑操作</text>
<text x="118" y="767" font-size="30" fill="#52627C" font-weight="400">变化中的屏幕</text>
<text x="118" y="812" font-size="30" fill="#52627C" font-weight="400">点击后重新核对</text>
<rect x="930" y="605" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="972" cy="648" r="20" fill="#2563EB"/>
<text x="966" y="656" font-size="23" fill="#FFFFFF" font-weight="600">4</text>
<text x="958" y="711" font-size="36" fill="#15243D" font-weight="650">机器人</text>
<text x="958" y="767" font-size="30" fill="#52627C" font-weight="400">连续传感反馈</text>
<text x="958" y="812" font-size="30" fill="#52627C" font-weight="400">受限动作与急停</text>
<line x1="90" y1="920" x2="1710" y2="920" stroke="#D7E0EF" stroke-width="2"/>
<text x="90" y="975" font-size="31" fill="#52627C" font-weight="400">接收新信息，不自动获得新权限</text>
<text x="90" y="1029" font-size="25" fill="#52627C" font-weight="400">苏打白 Dev · AI Agent 通俗学习版</text>
</g></svg>