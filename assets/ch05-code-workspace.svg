<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">代码与文件怎样支撑开放任务</title><desc id="desc">资料、动作与产物各有位置。读取资料 任务与已核实记忆 不把外部文字当指令；写并运行代码 受限环境处理数据 得到真实执行结果；检查产物 测试与实际渲染 核对目标与边界；保存可靠结果 报告、代码与证据 下次按需复用</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
