<text x="966" y="656" font-size="23" fill="#FFFFFF" font-weight="600">3</text>
<text x="958" y="711" font-size="36" fill="#15243D" font-weight="650">真实检查</text>
<text x="958" y="767" font-size="30" fill="#52627C" font-weight="400">功能、边界与回归</text>
<text x="958" y="812" font-size="30" fill="#52627C" font-weight="400">检查实际运行输出</text>
