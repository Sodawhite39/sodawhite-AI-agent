<path d="M880 387.5H916" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="930" y="250" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="972" cy="293" r="20" fill="#2563EB"/>
<text x="966" y="301" font-size="23" fill="#FFFFFF" font-weight="600">2</text>
<text x="958" y="356" font-size="36" fill="#15243D" font-weight="650">最小实现</text>
<text x="958" y="412" font-size="30" fill="#52627C" font-weight="400">只改必要部分</text>
<text x="958" y="457" font-size="30" fill="#52627C" font-weight="400">保护已有工作</text>
