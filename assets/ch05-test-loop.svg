<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">编程任务的验收与纠正循环</title><desc id="desc">代码写完只是中间节点。明确目标 读规则与需求 复杂改动先审方案；最小实现 只改必要部分 保护已有工作；真实检查 功能、边界与回归 检查实际运行输出；修正或交付 失败定位再修改 通过后说明证据</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
