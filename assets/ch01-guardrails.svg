<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="800" viewBox="0 0 1800 800" role="img" aria-labelledby="title desc"><title id="title">三层护栏各自检查什么</title><desc id="desc">资料、动作与数据分别设边界。上下文层 外部内容按资料处理 来源明确，指令分开；执行层 校验权限与参数 高风险动作请人确认；数据层 数据库强制访问范围 约束最终能改的数据</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="90" y="68" width="11" height="58" rx="5" fill="#2563EB"/>
<text x="125" y="113" font-size="52" fill="#15243D" font-weight="650">三层护栏各自检查什么</text>
<text x="125" y="175" font-size="32" fill="#52627C" font-weight="400">资料、动作与数据分别设边界</text>
<rect x="90" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="293" r="20" fill="#2563EB"/>
<text x="126" y="301" font-size="23" fill="#FFFFFF" font-weight="600">1</text>
<text x="118" y="356" font-size="36" fill="#15243D" font-weight="650">上下文层</text>
<text x="118" y="412" font-size="30" fill="#52627C" font-weight="400">外部内容按资料处理</text>
<text x="118" y="457" font-size="30" fill="#52627C" font-weight="400">来源明确，指令分开</text>
<rect x="650" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="692" cy="293" r="20" fill="#2563EB"/>
<text x="686" y="301" font-size="23" fill="#FFFFFF" font-weight="600">2</text>
<text x="678" y="356" font-size="36" fill="#15243D" font-weight="650">执行层</text>
<text x="678" y="412" font-size="30" fill="#52627C" font-weight="400">校验权限与参数</text>
<text x="678" y="457" font-size="30" fill="#52627C" font-weight="400">高风险动作请人确认</text>
<rect x="1210" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="1252" cy="293" r="20" fill="#2563EB"/>
<text x="1246" y="301" font-size="23" fill="#FFFFFF" font-weight="600">3</text>
<text x="1238" y="356" font-size="36" fill="#15243D" font-weight="650">数据层</text>
<text x="1238" y="412" font-size="30" fill="#52627C" font-weight="400">数据库强制访问范围</text>
<text x="1238" y="457" font-size="30" fill="#52627C" font-weight="400">约束最终能改的数据</text>
<line x1="90" y1="640" x2="1710" y2="640" stroke="#D7E0EF" stroke-width="2"/>
<text x="90" y="695" font-size="31" fill="#52627C" font-weight="400">多层防护降低风险，也要测试合法任务能否完成</text>
<text x="90" y="749" font-size="25" fill="#52627C" font-weight="400">苏打白 Dev · AI Agent 通俗学习版</text>
</g></svg>