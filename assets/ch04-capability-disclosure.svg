<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">能力形态与披露数量分别选择</title><desc id="desc">同一项能力怎样提供，以及一次提供多少，不是同一问题。专用工具 结构化参数 适合精细权限审计；通用执行器 代码处理多种任务 需要隔离与验证；Skill 工作说明 方法模板和脚本 由工具真正执行；全量或按需 是另一项披露决策 规模大时先给索引</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="90" y="68" width="11" height="58" rx="5" fill="#2563EB"/>
<text x="125" y="113" font-size="52" fill="#15243D" font-weight="650">能力形态与披露数量分别选择</text>
<text x="125" y="175" font-size="32" fill="#52627C" font-weight="400">同一项能力怎样提供，以及一次提供多少，不是同一问题</text>
<rect x="90" y="250" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="293" r="20" fill="#2563EB"/>
<text x="126" y="301" font-size="23" fill="#FFFFFF" font-weight="600">1</text>
<text x="118" y="356" font-size="36" fill="#15243D" font-weight="650">专用工具</text>
<text x="118" y="412" font-size="30" fill="#52627C" font-weight="400">结构化参数</text>
<text x="118" y="457" font-size="30" fill="#52627C" font-weight="400">适合精细权限审计</text>
<rect x="930" y="250" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="972" cy="293" r="20" fill="#2563EB"/>
<text x="966" y="301" font-size="23" fill="#FFFFFF" font-weight="600">2</text>
<text x="958" y="356" font-size="36" fill="#15243D" font-weight="650">通用执行器</text>
<text x="958" y="412" font-size="30" fill="#52627C" font-weight="400">代码处理多种任务</text>
<text x="958" y="457" font-size="30" fill="#52627C" font-weight="400">需要隔离与验证</text>
<rect x="90" y="605" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="648" r="20" fill="#2563EB"/>
<text x="126" y="656" font-size="23" fill="#FFFFFF" font-weight="600">3</text>
<text x="118" y="711" font-size="36" fill="#15243D" font-weight="650">Skill 工作说明</text>
<text x="118" y="767" font-size="30" fill="#52627C" font-weight="400">方法模板和脚本</text>
<text x="118" y="812" font-size="30" fill="#52627C" font-weight="400">由工具真正执行</text>
<rect x="930" y="605" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="972" cy="648" r="20" fill="#2563EB"/>
<text x="966" y="656" font-size="23" fill="#FFFFFF" font-weight="600">4</text>
<text x="958" y="711" font-size="36" fill="#15243D" font-weight="650">全量或按需</text>
<text x="958" y="767" font-size="30" fill="#52627C" font-weight="400">是另一项披露决策</text>
<text x="958" y="812" font-size="30" fill="#52627C" font-weight="400">规模大时先给索引</text>
<line x1="90" y1="920" x2="1710" y2="920" stroke="#D7E0EF" stroke-width="2"/>
<text x="90" y="975" font-size="31" fill="#52627C" font-weight="400">MCP 是通信协议；接入服务器不意味着所有工具定义每轮全量加载。</text>
<text x="90" y="1029" font-size="25" fill="#52627C" font-weight="400">苏打白 Dev · AI Agent 通俗学习版</text>
</g></svg>