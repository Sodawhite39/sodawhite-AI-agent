<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">RAG 从知识整理走到有据回答</title><desc id="desc">离线整理资料，提问时只取获准的相关材料。文档分块 保留自然边界 补来源与版本；建立索引 语义与关键词 附权限与有效期；检索候选 先按权限过滤 再寻找相关资料；融合重排 合并两路候选 精细判断相关性；注入上下文 少量相关材料 资料不等于命令；生成与核对 回答附证据入口 缺资料就说明缺口</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="90" y="68" width="11" height="58" rx="5" fill="#2563EB"/>
<text x="125" y="113" font-size="52" fill="#15243D" font-weight="650">RAG 从知识整理走到有据回答</text>
<text x="125" y="175" font-size="32" fill="#52627C" font-weight="400">离线整理资料，提问时只取获准的相关材料</text>
<rect x="90" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="293" r="20" fill="#2563EB"/>
<text x="126" y="301" font-size="23" fill="#FFFFFF" font-weight="600">1</text>
<text x="118" y="356" font-size="36" fill="#15243D" font-weight="650">文档分块</text>
<text x="118" y="412" font-size="30" fill="#52627C" font-weight="400">保留自然边界</text>
<text x="118" y="457" font-size="30" fill="#52627C" font-weight="400">补来源与版本</text>
<path d="M600 387.5H636" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="650" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="692" cy="293" r="20" fill="#2563EB"/>
<text x="686" y="301" font-size="23" fill="#FFFFFF" font-weight="600">2</text>
<text x="678" y="356" font-size="36" fill="#15243D" font-weight="650">建立索引</text>
<text x="678" y="412" font-size="30" fill="#52627C" font-weight="400">语义与关键词</text>
<text x="678" y="457" font-size="30" fill="#52627C" font-weight="400">附权限与有效期</text>
<path d="M1160 387.5H1196" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1210" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="1252" cy="293" r="20" fill="#2563EB"/>
<text x="1246" y="301" font-size="23" fill="#FFFFFF" font-weight="600">3</text>
<text x="1238" y="356" font-size="36" fill="#15243D" font-weight="650">检索候选</text>
<text x="1238" y="412" font-size="30" fill="#52627C" font-weight="400">先按权限过滤</text>
<text x="1238" y="457" font-size="30" fill="#52627C" font-weight="400">再寻找相关资料</text>
<path d="M1460 535V591" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1210" y="605" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="1252" cy="648" r="20" fill="#2563EB"/>
<text x="1246" y="656" font-size="23" fill="#FFFFFF" font-weight="600">4</text>
<text x="1238" y="711" font-size="36" fill="#15243D" font-weight="650">融合重排</text>
<text x="1238" y="767" font-size="30" fill="#52627C" font-weight="400">合并两路候选</text>
<text x="1238" y="812" font-size="30" fill="#52627C" font-weight="400">精细判断相关性</text>
<path d="M1200 742.5H1164" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="650" y="605" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="692" cy="648" r="20" fill="#2563EB"/>
<text x="686" y="656" font-size="23" fill="#FFFFFF" font-weight="600">5</text>
<text x="678" y="711" font-size="36" fill="#15243D" font-weight="650">注入上下文</text>
<text x="678" y="767" font-size="30" fill="#52627C" font-weight="400">少量相关材料</text>
<text x="678" y="812" font-size="30" fill="#52627C" font-weight="400">资料不等于命令</text>
<path d="M640 742.5H604" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="90" y="605" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="648" r="20" fill="#2563EB"/>
<text x="126" y="656" font-size="23" fill="#FFFFFF" font-weight="600">6</text>
<text x="118" y="711" font-size="36" fill="#15243D" font-weight="650">生成与核对</text>
<text x="118" y="767" font-size="30" fill="#52627C" font-weight="400">回答附证据入口</text>
<text x="118" y="812" font-size="30" fill="#52627C" font-weight="400">缺资料就说明缺口</text>
<line x1="90" y1="920" x2="1710" y2="920" stroke="#D7E0EF" stroke-width="2"/>
<text x="90" y="975" font-size="31" fill="#52627C" font-weight="400">检索不保证资料真实，局部候选也不能冒充全库统计。</text>
<text x="90" y="1029" font-size="25" fill="#52627C" font-weight="400">苏打白 Dev · AI Agent 通俗学习版</text>
</g></svg>