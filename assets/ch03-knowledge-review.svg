<text x="90" y="975" font-size="31" fill="#52627C" font-weight="400">审核者也可能犯错；证据独立、权限分离和必要人工确认不可省。</text>
<text x="90" y="1029" font-size="25" fill="#52627C" font-weight="400">苏打白 Dev · AI Agent 通俗学习版</text>
