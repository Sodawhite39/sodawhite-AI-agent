<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">知识更新先审查，再上线</title><desc id="desc">原始证据、可修订知识、检索索引各有职责。原始证据 保存来源和时间 限定授权范围；提议修改 工作分支提出差异 维护链接与索引；独立审核 回看原始证据 检查条件与冲突；检查合并 通过格式与权限检查 保留批准记录；发布派生索引 对应已审核版本 可重建与回滚；定期全库整理 去重、去旧、补条件 保留扫描覆盖清单</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
