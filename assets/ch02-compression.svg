<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">压缩缩小记录，不改变关键意思</title><desc id="desc">把资料整理成可以检查、可以继续办事的摘要。明确当前任务 用户目标与验收 决定哪些内容相关；删去无关重复 噪声不必反复总结 大输出保留原文件；保留关键事实 对象、条件与时间 决定、失败与理由；带上来源 原位置与证据入口 摘要仍是有损的；检查再继续 核对否定词和数字 记录待办与缺口</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="90" y="68" width="11" height="58" rx="5" fill="#2563EB"/>
<text x="125" y="113" font-size="52" fill="#15243D" font-weight="650">压缩缩小记录，不改变关键意思</text>
<text x="125" y="175" font-size="32" fill="#52627C" font-weight="400">把资料整理成可以检查、可以继续办事的摘要</text>
<rect x="90" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="293" r="20" fill="#2563EB"/>
<text x="126" y="301" font-size="23" fill="#FFFFFF" font-weight="600">1</text>
<text x="118" y="356" font-size="36" fill="#15243D" font-weight="650">明确当前任务</text>
<text x="118" y="412" font-size="30" fill="#52627C" font-weight="400">用户目标与验收</text>
<text x="118" y="457" font-size="30" fill="#52627C" font-weight="400">决定哪些内容相关</text>
<path d="M600 387.5H636" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="650" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="692" cy="293" r="20" fill="#2563EB"/>
<text x="686" y="301" font-size="23" fill="#FFFFFF" font-weight="600">2</text>
<text x="678" y="356" font-size="36" fill="#15243D" font-weight="650">删去无关重复</text>
<text x="678" y="412" font-size="30" fill="#52627C" font-weight="400">噪声不必反复总结</text>
<text x="678" y="457" font-size="30" fill="#52627C" font-weight="400">大输出保留原文件</text>
<path d="M1160 387.5H1196" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1210" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="1252" cy="293" r="20" fill="#2563EB"/>
<text x="1246" y="301" font-size="23" fill="#FFFFFF" font-weight="600">3</text>
<text x="1238" y="356" font-size="36" fill="#15243D" font-weight="650">保留关键事实</text>
<text x="1238" y="412" font-size="30" fill="#52627C" font-weight="400">对象、条件与时间</text>
<text x="1238" y="457" font-size="30" fill="#52627C" font-weight="400">决定、失败与理由</text>
<path d="M1460 535V591" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1210" y="605" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="1252" cy="648" r="20" fill="#2563EB"/>
<text x="1246" y="656" font-size="23" fill="#FFFFFF" font-weight="600">4</text>
<text x="1238" y="711" font-size="36" fill="#15243D" font-weight="650">带上来源</text>
<text x="1238" y="767" font-size="30" fill="#52627C" font-weight="400">原位置与证据入口</text>
<text x="1238" y="812" font-size="30" fill="#52627C" font-weight="400">摘要仍是有损的</text>
<path d="M1200 742.5H1164" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="650" y="605" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="692" cy="648" r="20" fill="#2563EB"/>
<text x="686" y="656" font-size="23" fill="#FFFFFF" font-weight="600">5</text>
<text x="678" y="711" font-size="36" fill="#15243D" font-weight="650">检查再继续</text>
<text x="678" y="767" font-size="30" fill="#52627C" font-weight="400">核对否定词和数字</text>
<text x="678" y="812" font-size="30" fill="#52627C" font-weight="400">记录待办与缺口</text>
<line x1="90" y1="920" x2="1710" y2="920" stroke="#D7E0EF" stroke-width="2"/>
<text x="90" y="975" font-size="31" fill="#52627C" font-weight="400">教学示意。引用能帮助回溯，但不能把有损摘要变成无损原文。</text>
<text x="90" y="1029" font-size="25" fill="#52627C" font-weight="400">苏打白 Dev · AI Agent 通俗学习版</text>
</g></svg>