<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">协作会新增哪些失败</title><desc id="desc">多几个成员，也要多一些可检查的边界。文件冲突 版本检查和工作副本 合并后核对语义关系；错误级联 保留原始证据 独立核对前序结论；同质趋同 不同来源与职责 防止同源意见冒充独立；互相扯皮 明确所有权和优先级 无法裁决时请人处理；循环失控 数量、预算和时间上限 取消并清理资源；理解债 人看懂关键决策 证据和责任不能省略</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="90" y="68" width="11" height="58" rx="5" fill="#2563EB"/>
<text x="125" y="113" font-size="52" fill="#15243D" font-weight="650">协作会新增哪些失败</text>
<text x="125" y="175" font-size="32" fill="#52627C" font-weight="400">多几个成员，也要多一些可检查的边界</text>
<rect x="90" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="293" r="20" fill="#2563EB"/>
<text x="126" y="301" font-size="23" fill="#FFFFFF" font-weight="600">1</text>
<text x="118" y="356" font-size="36" fill="#15243D" font-weight="650">文件冲突</text>
<text x="118" y="412" font-size="30" fill="#52627C" font-weight="400">版本检查和工作副本</text>
<text x="118" y="457" font-size="30" fill="#52627C" font-weight="400">合并后核对语义关系</text>
<rect x="650" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="692" cy="293" r="20" fill="#2563EB"/>
<text x="686" y="301" font-size="23" fill="#FFFFFF" font-weight="600">2</text>
<text x="678" y="356" font-size="36" fill="#15243D" font-weight="650">错误级联</text>
<text x="678" y="412" font-size="30" fill="#52627C" font-weight="400">保留原始证据</text>
<text x="678" y="457" font-size="30" fill="#52627C" font-weight="400">独立核对前序结论</text>
<rect x="1210" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="1252" cy="293" r="20" fill="#2563EB"/>
<text x="1246" y="301" font-size="23" fill="#FFFFFF" font-weight="600">3</text>
<text x="1238" y="356" font-size="36" fill="#15243D" font-weight="650">同质趋同</text>
<text x="1238" y="412" font-size="30" fill="#52627C" font-weight="400">不同来源与职责</text>
<text x="1238" y="457" font-size="30" fill="#52627C" font-weight="400">防止同源意见冒充独立</text>
<rect x="90" y="605" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="648" r="20" fill="#2563EB"/>
<text x="126" y="656" font-size="23" fill="#FFFFFF" font-weight="600">4</text>
<text x="118" y="711" font-size="36" fill="#15243D" font-weight="650">互相扯皮</text>
<text x="118" y="767" font-size="30" fill="#52627C" font-weight="400">明确所有权和优先级</text>
<text x="118" y="812" font-size="30" fill="#52627C" font-weight="400">无法裁决时请人处理</text>
<rect x="650" y="605" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="692" cy="648" r="20" fill="#2563EB"/>
<text x="686" y="656" font-size="23" fill="#FFFFFF" font-weight="600">5</text>
<text x="678" y="711" font-size="36" fill="#15243D" font-weight="650">循环失控</text>
<text x="678" y="767" font-size="30" fill="#52627C" font-weight="400">数量、预算和时间上限</text>
<text x="678" y="812" font-size="30" fill="#52627C" font-weight="400">取消并清理资源</text>
<rect x="1210" y="605" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="1252" cy="648" r="20" fill="#2563EB"/>
<text x="1246" y="656" font-size="23" fill="#FFFFFF" font-weight="600">6</text>
<text x="1238" y="711" font-size="36" fill="#15243D" font-weight="650">理解债</text>
<text x="1238" y="767" font-size="30" fill="#52627C" font-weight="400">人看懂关键决策</text>
<text x="1238" y="812" font-size="30" fill="#52627C" font-weight="400">证据和责任不能省略</text>
<line x1="90" y1="920" x2="1710" y2="920" stroke="#D7E0EF" stroke-width="2"/>
<text x="90" y="975" font-size="31" fill="#52627C" font-weight="400">多数成员意见一致，仍需检查是否共用同一个错误来源</text>
<text x="90" y="1029" font-size="25" fill="#52627C" font-weight="400">苏打白 Dev · AI Agent 通俗学习版</text>
</g></svg>