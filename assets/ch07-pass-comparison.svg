<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="800" viewBox="0 0 1800 800" role="img" aria-labelledby="title desc"><title id="title">三次里成功一次，与三次都成功</title><desc id="desc">教学假设：每次独立，成功率都是 50%。Pass@3 三次至少一次通过 1 − 0.5³ = 87.5% 适合探索能力上限；Pass^3 三次每一次都通过 0.5³ = 12.5% 关注稳定可靠交付；报告必须写清 同题采样还是连续业务 失败与副作用不可隐藏 真实情况未必独立</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="90" y="68" width="11" height="58" rx="5" fill="#2563EB"/>
<text x="125" y="113" font-size="52" fill="#15243D" font-weight="650">三次里成功一次，与三次都成功</text>
<text x="125" y="175" font-size="32" fill="#52627C" font-weight="400">教学假设：每次独立，成功率都是 50%</text>
<rect x="90" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="293" r="20" fill="#2563EB"/>
<text x="126" y="301" font-size="23" fill="#FFFFFF" font-weight="600">1</text>
<text x="118" y="356" font-size="36" fill="#15243D" font-weight="650">Pass@3</text>
<text x="118" y="412" font-size="30" fill="#52627C" font-weight="400">三次至少一次通过</text>
<text x="118" y="457" font-size="30" fill="#52627C" font-weight="400">1 − 0.5³ = 87.5%</text>
<text x="118" y="502" font-size="30" fill="#52627C" font-weight="400">适合探索能力上限</text>
<rect x="650" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="692" cy="293" r="20" fill="#2563EB"/>
<text x="686" y="301" font-size="23" fill="#FFFFFF" font-weight="600">2</text>
<text x="678" y="356" font-size="36" fill="#15243D" font-weight="650">Pass^3</text>
<text x="678" y="412" font-size="30" fill="#52627C" font-weight="400">三次每一次都通过</text>
<text x="678" y="457" font-size="30" fill="#52627C" font-weight="400">0.5³ = 12.5%</text>
<text x="678" y="502" font-size="30" fill="#52627C" font-weight="400">关注稳定可靠交付</text>
<rect x="1210" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="1252" cy="293" r="20" fill="#2563EB"/>
<text x="1246" y="301" font-size="23" fill="#FFFFFF" font-weight="600">3</text>
<text x="1238" y="356" font-size="36" fill="#15243D" font-weight="650">报告必须写清</text>
<text x="1238" y="412" font-size="30" fill="#52627C" font-weight="400">同题采样还是连续业务</text>
<text x="1238" y="457" font-size="30" fill="#52627C" font-weight="400">失败与副作用不可隐藏</text>
<text x="1238" y="502" font-size="30" fill="#52627C" font-weight="400">真实情况未必独立</text>
<line x1="90" y1="640" x2="1710" y2="640" stroke="#D7E0EF" stroke-width="2"/>
<text x="90" y="695" font-size="31" fill="#52627C" font-weight="400">概率是教学算例，不是任何产品实测成绩</text>
<text x="90" y="749" font-size="25" fill="#52627C" font-weight="400">苏打白 Dev · AI Agent 通俗学习版</text>
</g></svg>