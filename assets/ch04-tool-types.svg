<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">五类工具连接五种工作</title><desc id="desc">看行为与副作用，不只看工具服务器的名字。感知 获取外部信息 读取照片日期；执行 改变外部状态 复制照片文件；协作 请其他助手或人参与 独立核对统计；事件触发 先注册，事件后唤醒 定时检查任务；用户沟通 向用户传递消息 请求确认缺失年份</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
