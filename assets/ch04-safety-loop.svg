<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">执行不能只靠一句成功提示</title><desc id="desc">工具调用通过检查后执行，结果再回到下一轮判断。提出行动 目标和参数明确 不冒充用户批准；输入校验 检查类型与范围 异常快速拒绝；权限与确认 限定文件网络凭证 高风险由人确认；独立门控 Sidecar 或审核机制 放行前不执行危险动作；隔离执行 使用适当沙盒 控制时间与资源；核验并反馈 检查真实产物 错误理由进入轨迹</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="90" y="68" width="11" height="58" rx="5" fill="#2563EB"/>
<text x="125" y="113" font-size="52" fill="#15243D" font-weight="650">执行不能只靠一句成功提示</text>
<text x="125" y="175" font-size="32" fill="#52627C" font-weight="400">工具调用通过检查后执行，结果再回到下一轮判断</text>
<rect x="90" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="293" r="20" fill="#2563EB"/>
<text x="126" y="301" font-size="23" fill="#FFFFFF" font-weight="600">1</text>
<text x="118" y="356" font-size="36" fill="#15243D" font-weight="650">提出行动</text>
<text x="118" y="412" font-size="30" fill="#52627C" font-weight="400">目标和参数明确</text>
<text x="118" y="457" font-size="30" fill="#52627C" font-weight="400">不冒充用户批准</text>
<path d="M600 387.5H636" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="650" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="692" cy="293" r="20" fill="#2563EB"/>
<text x="686" y="301" font-size="23" fill="#FFFFFF" font-weight="600">2</text>
<text x="678" y="356" font-size="36" fill="#15243D" font-weight="650">输入校验</text>
<text x="678" y="412" font-size="30" fill="#52627C" font-weight="400">检查类型与范围</text>
<text x="678" y="457" font-size="30" fill="#52627C" font-weight="400">异常快速拒绝</text>
<path d="M1160 387.5H1196" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1210" y="250" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="1252" cy="293" r="20" fill="#2563EB"/>
<text x="1246" y="301" font-size="23" fill="#FFFFFF" font-weight="600">3</text>
<text x="1238" y="356" font-size="36" fill="#15243D" font-weight="650">权限与确认</text>
<text x="1238" y="412" font-size="30" fill="#52627C" font-weight="400">限定文件网络凭证</text>
<text x="1238" y="457" font-size="30" fill="#52627C" font-weight="400">高风险由人确认</text>
<path d="M1460 535V591" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1210" y="605" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="1252" cy="648" r="20" fill="#2563EB"/>
<text x="1246" y="656" font-size="23" fill="#FFFFFF" font-weight="600">4</text>
<text x="1238" y="711" font-size="36" fill="#15243D" font-weight="650">独立门控</text>
<text x="1238" y="767" font-size="30" fill="#52627C" font-weight="400">Sidecar 或审核机制</text>
<text x="1238" y="812" font-size="30" fill="#52627C" font-weight="400">放行前不执行危险动作</text>
<path d="M1200 742.5H1164" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="650" y="605" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="692" cy="648" r="20" fill="#2563EB"/>
<text x="686" y="656" font-size="23" fill="#FFFFFF" font-weight="600">5</text>
<text x="678" y="711" font-size="36" fill="#15243D" font-weight="650">隔离执行</text>
<text x="678" y="767" font-size="30" fill="#52627C" font-weight="400">使用适当沙盒</text>
<text x="678" y="812" font-size="30" fill="#52627C" font-weight="400">控制时间与资源</text>
<path d="M640 742.5H604" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="90" y="605" width="500" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="648" r="20" fill="#2563EB"/>
<text x="126" y="656" font-size="23" fill="#FFFFFF" font-weight="600">6</text>
<text x="118" y="711" font-size="36" fill="#15243D" font-weight="650">核验并反馈</text>
<text x="118" y="767" font-size="30" fill="#52627C" font-weight="400">检查真实产物</text>
<text x="118" y="812" font-size="30" fill="#52627C" font-weight="400">错误理由进入轨迹</text>
<path d="M82 742.5H55V387.5H78" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<line x1="90" y1="920" x2="1710" y2="920" stroke="#D7E0EF" stroke-width="2"/>
<text x="90" y="975" font-size="31" fill="#52627C" font-weight="400">执行前审批与执行后验证不同；超时不证明外部动作没有发生。</text>
<text x="90" y="1029" font-size="25" fill="#52627C" font-weight="400">苏打白 Dev · AI Agent 通俗学习版</text>
</g></svg>