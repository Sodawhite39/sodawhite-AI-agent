<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">完整尝试怎样变成训练更新</title><desc id="desc">正确与否由受保护的证据决定。当前模型 生成多条完整尝试 保存动作与结果；独立验证 核对测试与约束 给出可信奖励；计算相对优势 比较同组好坏 全相同则缺少差异；更新模型参数 小步调整概率 再用新版继续尝试</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="90" y="68" width="11" height="58" rx="5" fill="#2563EB"/>
<text x="125" y="113" font-size="52" fill="#15243D" font-weight="650">完整尝试怎样变成训练更新</text>
<text x="125" y="175" font-size="32" fill="#52627C" font-weight="400">正确与否由受保护的证据决定</text>
<rect x="90" y="250" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="293" r="20" fill="#2563EB"/>
<text x="126" y="301" font-size="23" fill="#FFFFFF" font-weight="600">1</text>
<text x="118" y="356" font-size="36" fill="#15243D" font-weight="650">当前模型</text>
<text x="118" y="412" font-size="30" fill="#52627C" font-weight="400">生成多条完整尝试</text>
<text x="118" y="457" font-size="30" fill="#52627C" font-weight="400">保存动作与结果</text>
<path d="M880 387.5H916" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="930" y="250" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="972" cy="293" r="20" fill="#2563EB"/>
<text x="966" y="301" font-size="23" fill="#FFFFFF" font-weight="600">2</text>
<text x="958" y="356" font-size="36" fill="#15243D" font-weight="650">独立验证</text>
<text x="958" y="412" font-size="30" fill="#52627C" font-weight="400">核对测试与约束</text>
<text x="958" y="457" font-size="30" fill="#52627C" font-weight="400">给出可信奖励</text>
<path d="M1320 535V591" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="930" y="605" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="972" cy="648" r="20" fill="#2563EB"/>
<text x="966" y="656" font-size="23" fill="#FFFFFF" font-weight="600">3</text>
<text x="958" y="711" font-size="36" fill="#15243D" font-weight="650">计算相对优势</text>
<text x="958" y="767" font-size="30" fill="#52627C" font-weight="400">比较同组好坏</text>
<text x="958" y="812" font-size="30" fill="#52627C" font-weight="400">全相同则缺少差异</text>
<path d="M920 742.5H884" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="90" y="605" width="780" height="275" rx="25" fill="#EEF4FF" stroke="#D7E0EF" stroke-width="2"/><circle cx="132" cy="648" r="20" fill="#2563EB"/>
<text x="126" y="656" font-size="23" fill="#FFFFFF" font-weight="600">4</text>
<text x="118" y="711" font-size="36" fill="#15243D" font-weight="650">更新模型参数</text>
<text x="118" y="767" font-size="30" fill="#52627C" font-weight="400">小步调整概率</text>
<text x="118" y="812" font-size="30" fill="#52627C" font-weight="400">再用新版继续尝试</text>
<path d="M82 742.5H55V387.5H78" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<line x1="90" y1="920" x2="1710" y2="920" stroke="#D7E0EF" stroke-width="2"/>
<text x="90" y="975" font-size="31" fill="#52627C" font-weight="400">本图说明GRPO因果关系，省略真实训练框架的数值细节</text>
<text x="90" y="1029" font-size="25" fill="#52627C" font-weight="400">苏打白 Dev · AI Agent 通俗学习版</text>
</g></svg>