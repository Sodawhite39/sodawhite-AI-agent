<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">从首个错误到两层回归测试</title><desc id="desc">根因与后果分开，修复与回归都要查。保存完整证据 任务、版本与观察 真实工具结果与状态；定位首个偏离 需求、看、想、做或验 记录步骤与置信度；冻结关键边界 首错前状态重放 允许集合与禁止动作；重跑完整任务 端到端结果与安全 检查旧任务没有退化</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Heiti SC,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
